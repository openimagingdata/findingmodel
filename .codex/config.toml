[mcp_servers.serena]
command = "uvx"
args = [
  "--python",
  "3.11",
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--context",
  "codex",

  # Option A (recommended for global Codex config): choose project at runtime
  "--project-from-cwd"
]

[mcp_servers.logfire]
url = "https://logfire-us.pydantic.dev/mcp"
bearer_token_env_var = "FINDINGMODEL_LOGFIRE_API_KEY"

